name: Build Windows Desktop Apps (.exe)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build-windows-exes:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python 3.11 on Windows
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract Any Uploaded Zip & Install Dependencies
        shell: bash
        run: |
          for z in *.zip; do
            if [ -f "$z" ]; then
              unzip -o "$z"
            fi
          done
          python -m pip install --upgrade pip
          pip install PyQt6 opencv-python numpy onnxruntime-directml pyinstaller

      - name: Stage Any Uploaded AI Models into Resources/ & Compile Standalone .exe Apps
        shell: bash
        run: |
          shopt -s nocaseglob
          mkdir -p dist_exes Resources
          for ext in onnx pth pt mlmodel model; do
            for f in *."$ext" Resources/*."$ext"; do
              if [ -f "$f" ]; then
                cp -f "$f" Resources/ 2>/dev/null || true
              fi
            done
          done
          touch Resources/.keep

          # Locate Offline Studio script (case-insensitive)
          STUDIO_PY=""
          for candidate in OfflineAIVideoStudioWindows.py offlineaivideostudiowindows.py *offline*studio*.py; do
            if [ -f "$candidate" ]; then
              STUDIO_PY="$candidate"
              break
            fi
          done

          if [ -n "$STUDIO_PY" ]; then
            echo "Building OfflineAIVideoStudioWindows.exe from $STUDIO_PY..."
            pyinstaller --noconfirm --onefile --windowed \
              --name "OfflineAIVideoStudioWindows" \
              --add-data "Resources;Resources" \
              "$STUDIO_PY"
            cp "dist/OfflineAIVideoStudioWindows.exe" dist_exes/
          fi

          # Locate Pro Media Player script (case-insensitive)
          PLAYER_PY=""
          for candidate in ProMediaPlayerWindows.py promediaplayerwindows.py *promediaplayer*windows*.py; do
            if [ -f "$candidate" ]; then
              PLAYER_PY="$candidate"
              break
            fi
          done

          if [ -n "$PLAYER_PY" ]; then
            echo "Building ProMediaPlayerWindows.exe from $PLAYER_PY..."
            pyinstaller --noconfirm --onefile --windowed \
              --name "ProMediaPlayerWindows" \
              --add-data "Resources;Resources" \
              "$PLAYER_PY"
            cp "dist/ProMediaPlayerWindows.exe" dist_exes/
          fi
          ls -lh dist_exes/

      - name: Upload Windows .exe Applications as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows-AI-Media-Suite-EXEs
          path: dist_exes/*.exe
          if-no-files-found: warn

      - name: Publish Windows .exe Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: win-v1.0.${{ github.run_number }}
          name: "Windows AI Media Suite (.exe Build #${{ github.run_number }})"
          body: "Standalone Windows 10/11 (`.exe`) desktop builds:\n- **ProMediaPlayerWindows.exe** (100% Self-Contained Live 60fps AI Media Player + Built-in Offline Studio)\n- **OfflineAIVideoStudioWindows.exe** (Dedicated Batch Offline AI Video Mastering Studio)"
          files: dist_exes/*.exe
